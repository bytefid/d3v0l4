name: Build

on:
  push:
    branches: ["main", "py"]
  pull_request:
    branches: ["main", "py"]

permissions:
  contents: read

env:
  PYGAME_HIDE_SUPPORT_PROMPT: "1"
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS ARM64
            artifact: popola-macos-arm64
            exe_suffix: ""
          - os: ubuntu-latest
            name: Linux x86_64
            artifact: popola-linux-x86_64
            exe_suffix: ""
          - os: macos-15-intel
            name: macOS Intel
            artifact: popola-macos-x86_64
            exe_suffix: ""
          - os: windows-latest
            name: Windows x86_64
            artifact: popola-windows-x86_64
            exe_suffix: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install ".[build]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --name ${{ matrix.artifact }} --paths src --collect-data p0p0l4 src/main.py
      - name: Upload executable
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}${{ matrix.exe_suffix }}
          if-no-files-found: error
          retention-days: 28
