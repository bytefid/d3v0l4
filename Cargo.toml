[package]
name = "p0p0l4"
version = "0.2.1"
edition = "2024"
description = "env with bio-net"
authors = ["bytefid <bytefid@gmail.com>"]
license = "Apache-2.0"

[dependencies]
macroquad = "0.4.16"
rand = "0.10.3"

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = true
panic = "abort"
