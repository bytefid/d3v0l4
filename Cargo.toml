[workspace]
resolver = "3"
members = [
    "crates/devola",
    "crates/devola_core",
    "crates/devola_world",
]

[workspace.package]
edition = "2024"
authors = ["bytefid <bytefid@gmail.com>"]
license = "Apache-2.0"

[workspace.dependencies]
devola_core = { path = "crates/devola_core" }
devola_world = { path = "crates/devola_world" }
bevy = "0.20.0"
rand = "0.10.3"

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = true
panic = "abort"
